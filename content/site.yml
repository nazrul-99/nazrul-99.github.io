# Example (copy this block to see every field):
#
# name: "Jane Doe"
# email:
#   user: "jane.doe"
#   domain: "gmail.com"
# links:
#   - label: "Google Scholar"
#     url: "https://scholar.google.com/citations?user=XXXXXXX"
#   - label: "GitHub"
#     url: "https://github.com/janedoe"

name: "Md. Nazrul Islam"
# The homepage <title> and the headline of its search result. The name alone
# is shared by many people, so it carries the research areas too. Other
# pages keep "Publications — <name>". Leave "" to use the name alone.
search_title: "Md. Nazrul Islam — Vision-Language Models and Bangla NLP"
# Other spellings of the name, so search engines join them to this person
# (JSON-LD alternateName). Not shown on the page.
alternate_names:
  - "Md Nazrul Islam"
  - "Nazrul Islam"
# true: keep cv.pdf out of search. robots.txt disallows it for every crawler,
# the sitemap leaves it out, and both CV links carry rel="nofollow". The
# pages stay indexed; visitors still download the CV as before. Set while
# papers are under double-blind review; false lets search engines index it.
hide_cv_from_search: true
# Split on " — ": the part before is the role line, the part after the
# institution line in About (DESIGN.md v2).
affiliation: "Lecturer, CSE — Southeast University, Dhaka"
# The institution line in About links here (same tab, rel="me").
affiliation_url: "https://cse.seu.edu.bd/employee/profile/MDAzMDA4"
# Square, at least 540 px (shown at 270 px), optional: the page must look
# right with this line removed.
# Source file lives in _source/; the copy in static/ is what gets published.
portrait: "/static/portrait.jpg"
# Profile URLs for the icon rows (About and Contact). A blank value hides
# that icon. Scholar is read from `links` below.
github: "https://github.com/nazrul-99"
linkedin: "https://www.linkedin.com/in/md-nazrul-islam-nz/"
# Full https://orcid.org/ URL. Shown as an icon in About and Contact, and
# the strongest signal that tells search engines which Md. Nazrul Islam
# this site belongs to. A blank value hides it.
orcid: "https://orcid.org/0000-0002-6385-5095"
# Short call-out under the institution in About. Leave "" to hide the block.
notice: >
  Applying to PhD programs. Open to conversations with groups working on
  vision-language models, evaluation methodology, or low-resource NLP.
# Rendered as the "Interests" bullet list beside Education in About
# (DESIGN.md v2), and middle-dot joined in the CV. Parallel noun phrases,
# each capitalised, since each is its own bullet.
interests:
  - "Vision-language models"
  - "Spatial and geometric reasoning"
  - "Benchmark validity"
  - "Explanation faithfulness"
  - "Robustness in low-resource NLP"
email:
  user: "nazrul.islam.cse.bd"
  domain: "gmail.com"
links:
  - label: "Google Scholar"
    url: "https://scholar.google.com/citations?user=qr34ziEAAAAJ"
  - label: "GitHub"
    url: "https://github.com/nazrul-99"
