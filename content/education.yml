# Wording below is transcribed from _source/cv.docx. FLAGS are collected at the
# bottom of this file.

degrees:
  - degree: "B.Sc. in Computer Science & Engineering"
    institution: "Khulna University of Engineering & Technology (KUET), Khulna, Bangladesh"
    period: "January 2018 – February 2023"
    details: "CGPA: 3.68/4.00 (top 20%, Dept. of CSE)"

teaching:
  - role: "Lecturer"
    course: "programming, numerical methods, and introductory AI"
    institution: "Dept. of CSE, Southeast University, Dhaka, Bangladesh"
    period: "February 2024 – Present"
    bullets:
      - "Supervise undergraduate research projects in machine learning and NLP."
  - role: "Lecturer"
    institution: "Dept. of CSE, Uttara University, Dhaka, Bangladesh"
    period: "July 2023 – February 2024"
  - role: "Part-time Lecturer"
    institution: "Dept. of CSE, Central University of Science and Technology, Dhaka, Bangladesh"
    period: "March 2023 – July 2023"

# CV § HONORS & AWARDS, split into the card fields without rewording.
honors:
  - title: "Ranked 10th globally and 1st among Bangladeshi teams, Indian Rover Design Challenge (IRDC) 2020"
    organisation: "Mars Society South Asia — Team Durbar, KUET"
    years: "2020"
  - title: "Dean's Award"
    organisation: "Faculty of Electrical and Electronic Engineering, KUET"
    years: "AY 2018–2019 and 2019–2020"

# CV § LEADERSHIP & VOLUNTEER EXPERIENCE: the club role and the rover team.
# The supervision line is part of the SEU lecturer role and sits under
# teaching:. Order here does not matter: build.py sorts every timeline by
# start date, newest first.
service:
  - title: "Vice President"
    organisation: "Hardware Acceleration Club of KUET (HACK)"
    years: "March 2022 – March 2023"
    bullets:
      - "Ran the club's activities and events."
      - "Led workshops on commonly used microcontrollers."
  - title: "Programmer, Software Sub-Team"
    organisation: "KUET Mars Rover (Team Durbar)"
    years: "March 2019 – December 2022"
    bullets:
      - "Senior Programmer: rover navigation and computer vision, including a lightweight CNN for object recognition."
      - "Junior Programmer: worked with Arduino and Raspberry Pi to implement key rover systems."

