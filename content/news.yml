- date: "Nov 2026"
  text: >
    My paper "Low Scores Without a Perceptual Deficit" was accepted at ICCIT
    2026. It separates answer-position bias from perception on MMVP.
  link: "#mmvp-position-bias"
  link_text: "Paper"

- date: "Nov 2026"
  text: >
    Student paper accepted at ICCIT 2026, with students Md. Arifur Alvi and
    Abdullah Al Saif and my colleague Md. Habibullah Belali, Assistant
    Professor at Southeast University. We compare seven fundus-image classifiers
    on 4,217 images under one fixed protocol. Weighted gated DenseNet-121 and
    ViT fusion reaches 94.26% mean accuracy.
