- id: "sql-injection"
  title: "Multiclass SQL Injection Detection via Hybrid CNN–Transformer"
  pitch: >
    I built a hybrid 1D CNN–TinyBERT classifier for multiclass SQL-injection
    payloads. Because payload classes are heavily imbalanced, I evaluated it
    with macro-F1 and PR-AUC under realistic adversarial scenarios, rather than
    accuracy alone.
  description: ""
  role: ""
  stack: ["PyTorch", "Python"]
  period: "2024 – 2025"
  repo: "https://github.com/nazrul-99/SQLi"
  demo: ""
  featured: true

- id: "text-to-sql"
  title: "Lightweight LLM and Reinforcement Learning for Text-to-SQL Generation"
  pitch: >
    I built a TinyBERT-based text-to-SQL system on the Spider dataset. Adding
    reinforcement learning from execution feedback improved logical
    correctness without requiring a larger model.
  description: ""
  role: ""
  stack: ["PyTorch", "Python"]
  period: "2023"
  repo: "https://github.com/nazrul-99/Text-to-Sql"
  demo: ""
  featured: true
