- id: "geotoken"
  title: "GeoToken: Differentiable 3D Voxel Tokenization for Geometric Spatial Reasoning in VLMs"
  authors: ["Md. Asiful Islam Miah", "Md. Nazrul Islam", "S M Taslim Uddin Raju", "Hamdi Altaheri"]
  venue: "AAAI 2027"
  year: 2027
  type: "conference"
  status: "under-review"
  anonymized: false
  equal_contribution: [0, 1]
  links:
    paper: "https://drive.google.com/file/d/1ELj4VhWy8dj_DHJAQdN-i3FPRE4wxLzI/view?usp=sharing"
  bibtex: ""
  note: ""
  summary: >
    We built a 1B-parameter spatial vision-language model. It lifts a single
    RGB image into a metric point cloud. A soft clustering compresses the cloud
    into a few dozen tokens that each carry a real 3D position, so the language
    model reasons over geometry rather than a patch grid. Inference fits in
    under 4 GB.

- id: "mmvp-position-bias"
  title: "Low Scores Without a Perceptual Deficit: Separating Answer-Position Bias from Perception on MMVP"
  authors: ["Md. Nazrul Islam", "Md. Habibullah Belali"]
  venue: "ICCIT 2026"
  year: 2026
  type: "conference"
  status: "under-review"
  # ICCIT is single-blind; the submission carries names
  anonymized: false
  equal_contribution: []
  links:
    paper: "https://drive.google.com/file/d/1UDr-B_FffHD4PoJ-6FCMyF1hHBAY2T0h/view?usp=drive_link"
  bibtex: ""
  note: ""
  summary: >
    MMVP's sub-chance scores are read as evidence that small VLMs cannot
    resolve fine visual detail. Re-asking each question with the two options
    reversed, one extra forward pass, shows the scores track answer-position
    bias instead. Perceptual accuracy is statistically indistinguishable across
    models spanning a fivefold range of published numbers.

- id: "bangla-ner-orthography"
  title: "Anchored to the Form: Bangla Named Entity Recognition Depends on Entity Orthography, Not Context"
  authors: ["Md. Nazrul Islam"]
  venue: "ACL Rolling Review, targeting NAACL 2027"
  year: 2027
  type: "conference"
  # under review with prospective advisors; not yet submitted
  status: "in-preparation"
  anonymized: false
  equal_contribution: []
  links:
    paper: "https://drive.google.com/file/d/1E884NEl2vrYF_mzatFBf4iTkKgrHShFN/view?usp=sharing"
  bibtex: ""
  note: ""
  summary: >
    Bangla NER models are assumed to generalize from context the way English
    models do. Under controlled character perturbation they turn out to depend
    on memorized entity spellings instead, by 9.3 to 1. Failing to find the
    entity at all accounts for 86% of the damage. The defense that diagnosis
    predicts recovers up to 14.3 F1, whereas the standard adversarial recipe
    recovers nothing measurable.

