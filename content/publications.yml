- id: "blood-donor-forecasting"
  title: "Blood Donor Arrival Forecasting Using Regression Model and Analysis of Donor Behavioural Pattern"
  authors: ["Towsif Ahamed", "Md. Nazrul Islam", "S. M. Taslim Uddin Raju", "M. M. A. Hashem"]
  venue: "ICCIT 2022"
  year: 2022
  type: "conference"
  status: "published"
  anonymized: false
  equal_contribution: []
  links:
    doi: "https://doi.org/10.1109/ICCIT57492.2022.10054710"
  bibtex: |
    @inproceedings{ahamed2022blood,
      author    = {Ahamed, Towsif and Islam, Md. Nazrul and Raju, S. M. Taslim Uddin and Hashem, M. M. A.},
      title     = {Blood Donor Arrival Forecasting Using Regression Model and Analysis of Donor Behavioural Pattern},
      booktitle = {2022 25th International Conference on Computer and Information Technology (ICCIT)},
      pages     = {897--902},
      year      = {2022},
      doi       = {10.1109/ICCIT57492.2022.10054710}
    }
  note: "pp. 897–902"
  summary: >
    OneBlood's donor-contact records convert at 2.67%, so classifying
    individual donors recovers 7% of them. Forecasting aggregate counts over
    propensity buckets instead brought month-ahead error to 0.3%. OneBlood
    deployed the model across 1.05 million approaches.
